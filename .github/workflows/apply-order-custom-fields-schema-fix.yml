name: Apply verified OrderInput customFields fix

on:
  push:
    branches:
      - fix/rc1-order-custom-fields-schema

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrowly typed GraphQL contract fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('src/schemas/schema.graphql')
          text = schema_path.read_text()

          custom_type = '''"Approved custom order fields accepted during checkout"
          input OrderCustomFieldsInput {
            "IANA time-zone identifier used for time-based pricing/discount evaluation"
            timeZone: String
          }

          '''
          marker = '"Input for placing an order"\ninput OrderInput {'
          if 'input OrderCustomFieldsInput {' not in text:
              if marker not in text:
                  raise SystemExit('OrderInput marker not found')
              text = text.replace(marker, custom_type + marker, 1)

          start = text.index('input OrderInput {')
          end_marker = '\n}\n\n"Input for adding order payments"'
          end = text.index(end_marker, start)
          block = text[start:end]
          if 'customFields:' not in block:
              anchor = '  currencyCode: String!\n'
              if anchor not in block:
                  raise SystemExit('OrderInput currencyCode anchor not found')
              addition = '''  currencyCode: String!

            "Approved custom checkout fields used by Ranchers order processing"
            customFields: OrderCustomFieldsInput
          '''
              block = block.replace(anchor, addition, 1)
              text = text[:start] + block + text[end:]

          schema_path.write_text(text)

          test_path = Path('tests/orderCustomFieldsGraphqlContract.unit.mjs')
          test_path.write_text('''import assertModule from "assert";
          import { readFile } from "fs/promises";

          const assert = assertModule.strict;
          const schema = await readFile(new URL("../src/schemas/schema.graphql", import.meta.url), "utf8");

          assert.match(schema, /input\\s+OrderCustomFieldsInput\\s*\\{[\\s\\S]*timeZone:\\s*String[\\s\\S]*\\}/);

          const orderInputMatch = schema.match(/input\\s+OrderInput\\s*\\{([\\s\\S]*?)\\n\\}/);
          assert.ok(orderInputMatch, "OrderInput definition must exist");
          assert.match(orderInputMatch[1], /customFields:\\s*OrderCustomFieldsInput/);

          assert.doesNotMatch(
            orderInputMatch[1],
            /customFields:\\s*(JSON|JSONObject|Object|Any)/,
            "OrderInput.customFields must remain narrowly typed",
          );

          console.log("PASS OrderInput customFields GraphQL contract");
          ''')
          PY

          node tests/orderCustomFieldsGraphqlContract.unit.mjs
          git diff --check

      - name: Commit source fix once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/schemas/schema.graphql tests/orderCustomFieldsGraphqlContract.unit.mjs; then
            echo "Schema fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/schemas/schema.graphql tests/orderCustomFieldsGraphqlContract.unit.mjs
          git commit -m "fix: accept checkout custom time zone in OrderInput"
          git push origin HEAD:fix/rc1-order-custom-fields-schema
