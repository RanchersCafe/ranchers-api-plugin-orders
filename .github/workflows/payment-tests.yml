name: Payment Tests

on:
  push:
    branches:
      - trunk
      - codex/checkout-payment-hardening
  pull_request:

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --check src/index.js
      - run: node --check src/payments/paymentMath.js
      - run: node --check src/payments/easypaisaProtocol.js
      - run: node --check src/payments/processEasyPaisaStatus.js
      - run: node --check src/payments/reconcilePendingPayments.js
      - run: node --check src/payments/paymentRoutes.js
      - run: node --check src/util/easyPaisaPayment.js
      - run: node tests/run.mjs
