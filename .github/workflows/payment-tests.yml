name: Payment Tests

on:
  push:
    branches:
      - codex/checkout-payment-hardening
      - release/stabilization-rc1
  pull_request:

permissions:
  contents: write

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
      - name: Apply deterministic source hardening
        run: node scripts/hardenPlaceOrderSource.mjs --write
      - name: Verify source hardening
        run: node scripts/hardenPlaceOrderSource.mjs
      - name: Verify security and pricing regression controls
        run: |
          node tests/placeOrderSecurity.unit.mjs
          node tests/serverPaymentSnapshot.unit.mjs
      - name: Commit hardened source on RC1 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/stabilization-rc1'
        run: |
          if git diff --quiet -- src/mutations/placeOrder.js; then
            echo "Place-order source is already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mutations/placeOrder.js
          git commit -m "fix(payments): enforce server-authoritative order pricing"
          git push origin HEAD:release/stabilization-rc1
      - run: npm install --no-audit --no-fund --silent
      - run: node --check src/index.js
      - run: node --check src/mutations/placeOrder.js
      - run: node --check src/mutations/placeOrderGuarded.js
      - run: node --check src/payments/serverPaymentSnapshot.js
      - run: node --check src/util/easyPaisaPayment.js
      - run: node --check src/payments/processEasyPaisaStatus.js
      - run: node --check src/payments/reconcilePendingPayments.js
      - id: payment_test
        continue-on-error: true
        run: node tests/run.mjs > payment-test.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: payment-test-diagnostics
          path: payment-test.log
      - if: steps.payment_test.outcome == 'failure'
        run: cat payment-test.log && exit 1
