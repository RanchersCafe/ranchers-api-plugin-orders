name: Payment Tests

on:
  push:
    branches:
      - codex/checkout-payment-hardening
  pull_request:

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
      - run: npm install --no-audit --no-fund --silent
      - run: node -e "import('./tests/easypaisa.integration.mjs').then(m => m.runEasyPaisaIntegrationTests())"
