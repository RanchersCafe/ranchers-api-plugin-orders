name: Payment Tests

on:
  push:
    branches:
      - trunk
      - codex/checkout-payment-hardening
  pull_request:

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/payments/paymentMath.js
          node --check src/payments/easypaisaProtocol.js
          node --check src/payments/processEasyPaisaStatus.js
          node --check src/payments/reconcilePendingPayments.js
          node --check src/payments/paymentRoutes.js
          node --check src/util/easyPaisaPayment.js
      - name: Payment core unit tests
        run: node -e "import('./tests/paymentCore.unit.mjs').then(m => m.runPaymentCoreUnitTests())"
      - name: Easypaisa initiation integration tests
        run: node -e "import('./tests/easypaisa.integration.mjs').then(m => m.runEasyPaisaIntegrationTests())"
      - name: Easypaisa status integration tests
        run: node -e "import('./tests/easypaisaStatus.integration.mjs').then(m => m.runEasyPaisaStatusIntegrationTests())"
      - name: Reconciliation integration tests
        run: node -e "import('./tests/reconciliation.integration.mjs').then(m => m.runReconciliationIntegrationTests())"
      - name: Pending reconciliation retry test
        run: node -e "import('./tests/reconciliation.pending.mjs').then(m => m.runPendingReconciliationTest())"
