name: Payment Tests

on:
  pull_request:
    paths:
      - "src/payments/**"
      - "src/util/easyPaisaPayment.js"
      - "src/util/paymentStatus.js"
      - "tests/**"
      - "package.json"
  push:
    branches:
      - trunk
    paths:
      - "src/payments/**"
      - "src/util/easyPaisaPayment.js"
      - "src/util/paymentStatus.js"
      - "tests/**"
      - "package.json"

jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node --check src/payments/paymentMath.js
      - run: node --check src/payments/easypaisaProtocol.js
      - run: node --check src/payments/reconcilePendingPayments.js
      - run: node --check src/util/easyPaisaPayment.js
      - run: node tests/run.mjs
